<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Keuangan Keluarga</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-100 min-h-screen font-sans flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <!-- Logo & Title -->
    <div class="text-center mb-8">
      <div class="w-20 h-20 bg-emerald-100 rounded-3xl flex items-center justify-center mx-auto mb-4 shadow-lg">
        <span class="text-4xl">💰</span>
      </div>
      <h1 class="text-2xl font-bold text-gray-800">Keuangan Keluarga</h1>
      <p class="text-gray-500 text-sm mt-1">Catat keuangan dengan mudah</p>
    </div>

    <!-- Login Form -->
    <div id="login-view" class="card">
      <div class="card-header">
        <h2 class="text-lg font-bold text-gray-800">👋 Masuk</h2>
      </div>
      <form id="form-login" class="space-y-4">
        <div>
          <label for="login-email">Email</label>
          <input type="email" id="login-email" class="input-field" placeholder="email@contoh.com" required>
        </div>
        <div>
          <label for="login-password">Password</label>
          <input type="password" id="login-password" class="input-field" placeholder="Minimal 6 karakter" required>
        </div>
        <button type="submit" class="btn-primary w-full" id="btn-login">🚀 Masuk</button>
      </form>
      <div class="mt-4 text-center">
        <p class="text-sm text-gray-500">
          Belum punya akun?
          <button id="btn-show-register" class="text-emerald-600 hover:text-emerald-700 font-semibold hover:underline">Daftar</button>
        </p>
      </div>
    </div>

    <!-- Register Form -->
    <div id="register-view" class="card hidden">
      <div class="card-header">
        <h2 class="text-lg font-bold text-gray-800">📝 Daftar</h2>
      </div>
      <form id="form-register" class="space-y-4">
        <div>
          <label for="register-name">Nama Lengkap</label>
          <input type="text" id="register-name" class="input-field" placeholder="Nama Anda">
        </div>
        <div>
          <label for="register-email">Email</label>
          <input type="email" id="register-email" class="input-field" placeholder="email@contoh.com" required>
        </div>
        <div>
          <label for="register-password">Password</label>
          <input type="password" id="register-password" class="input-field" placeholder="Minimal 6 karakter" required minlength="6">
        </div>
        <button type="submit" class="btn-primary w-full" id="btn-register">🚀 Daftar</button>
      </form>
      <div class="mt-4 text-center">
        <p class="text-sm text-gray-500">
          Sudah punya akun?
          <button id="btn-show-login" class="text-emerald-600 hover:text-emerald-700 font-semibold hover:underline">Masuk</button>
        </p>
      </div>
    </div>

    <!-- Error Message -->
    <div id="auth-error" class="hidden mt-4 p-4 bg-red-50 border-2 border-red-200 rounded-xl text-red-600 text-sm text-center font-medium"></div>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const loginView = document.getElementById('login-view');
      const registerView = document.getElementById('register-view');
      const errorEl = document.getElementById('auth-error');

      document.getElementById('btn-show-register').addEventListener('click', () => {
        loginView.classList.add('hidden');
        registerView.classList.remove('hidden');
        errorEl.classList.add('hidden');
      });

      document.getElementById('btn-show-login').addEventListener('click', () => {
        registerView.classList.add('hidden');
        loginView.classList.remove('hidden');
        errorEl.classList.add('hidden');
      });

      function showError(msg) {
        errorEl.textContent = msg;
        errorEl.classList.remove('hidden');
      }

      document.getElementById('form-login').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;
        const btn = document.getElementById('btn-login');
        btn.disabled = true;
        btn.textContent = '⏳ Masuk...';
        errorEl.classList.add('hidden');

        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) {
          showError(error.message);
          btn.disabled = false;
          btn.textContent = '🚀 Masuk';
        } else {
          window.location.href = 'index.html';
        }
      });

      document.getElementById('form-register').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('register-name').value;
        const email = document.getElementById('register-email').value;
        const password = document.getElementById('register-password').value;
        const btn = document.getElementById('btn-register');
        btn.disabled = true;
        btn.textContent = '⏳ Mendaftar...';
        errorEl.classList.add('hidden');

        const { data, error } = await supabaseClient.auth.signUp({
          email,
          password,
          options: { data: { full_name: name } }
        });
        if (error) {
          showError(error.message);
          btn.disabled = false;
          btn.textContent = '🚀 Daftar';
        } else {
          showError('✅ Akun berhasil dibuat! Cek email untuk verifikasi, lalu masuk.');
          loginView.classList.remove('hidden');
          registerView.classList.add('hidden');
          btn.disabled = false;
          btn.textContent = '🚀 Daftar';
        }
      });

      supabaseClient.auth.getSession().then(({ data: { session } }) => {
        if (session) window.location.href = 'index.html';
      });
    });
  </script>
</body>
</html>
