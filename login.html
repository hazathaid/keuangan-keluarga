<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Keuangan Keluarga</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', system-ui, sans-serif; }

    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ecfdf5 0%, #f0fdf4 50%, #f0f9ff 100%);
      padding: 1rem;
    }

    .login-card {
      width: 100%;
      max-width: 24rem;
      background: white;
      border-radius: 1.5rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08), 0 4px 16px rgba(0, 0, 0, 0.04);
      padding: 2.5rem;
      border: 1px solid rgba(0, 0, 0, 0.04);
    }

    .logo-box {
      width: 5rem;
      height: 5rem;
      background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%);
      border-radius: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.2);
    }

    .form-label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 0.5rem;
    }

    .form-input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 2px solid #e5e7eb;
      border-radius: 0.75rem;
      font-size: 0.875rem;
      color: #111827;
      background: white;
      transition: all 0.15s ease;
      outline: none;
      box-sizing: border-box;
    }

    .form-input:focus {
      border-color: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
    }

    .form-input::placeholder {
      color: #9ca3af;
    }

    .btn-submit {
      width: 100%;
      padding: 0.875rem 1.5rem;
      background: linear-gradient(135deg, #059669 0%, #10b981 100%);
      color: white;
      border: none;
      border-radius: 0.75rem;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
      margin-top: 0.5rem;
    }

    .btn-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .switch-text {
      text-align: center;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid #f3f4f6;
    }

    .switch-text p {
      font-size: 0.8125rem;
      color: #6b7280;
    }

    .switch-text button {
      color: #059669;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.15s;
    }

    .switch-text button:hover {
      color: #047857;
      text-decoration: underline;
    }

    .error-box {
      margin-top: 1rem;
      padding: 0.875rem 1rem;
      background: #fef2f2;
      border: 2px solid #fecaca;
      border-radius: 0.75rem;
      color: #dc2626;
      font-size: 0.8125rem;
      text-align: center;
      font-weight: 500;
    }

    .error-box.success {
      background: #f0fdf4;
      border-color: #bbf7d0;
      color: #16a34a;
    }

    .form-group {
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <!-- Logo -->
      <div style="text-align: center; margin-bottom: 2rem;">
        <div class="logo-box">
          <span style="font-size: 2.5rem;">💰</span>
        </div>
        <h1 style="font-size: 1.5rem; font-weight: 700; color: #111827; margin: 0;">Keuangan Keluarga</h1>
        <p style="font-size: 0.8125rem; color: #6b7280; margin-top: 0.375rem;">Catat keuangan dengan mudah</p>
      </div>

      <!-- Login Form -->
      <div id="login-view">
        <form id="form-login">
          <div class="form-group">
            <label class="form-label" for="login-email">Email</label>
            <input type="email" id="login-email" class="form-input" placeholder="email@contoh.com" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="login-password">Password</label>
            <input type="password" id="login-password" class="form-input" placeholder="Minimal 6 karakter" required>
          </div>
          <button type="submit" class="btn-submit" id="btn-login">Masuk</button>
        </form>
        <div class="switch-text">
          <p>Belum punya akun? <button id="btn-show-register">Daftar sekarang</button></p>
        </div>
      </div>

      <!-- Register Form -->
      <div id="register-view" style="display: none;">
        <form id="form-register">
          <div class="form-group">
            <label class="form-label" for="register-name">Nama Lengkap</label>
            <input type="text" id="register-name" class="form-input" placeholder="Nama Anda">
          </div>
          <div class="form-group">
            <label class="form-label" for="register-email">Email</label>
            <input type="email" id="register-email" class="form-input" placeholder="email@contoh.com" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="register-password">Password</label>
            <input type="password" id="register-password" class="form-input" placeholder="Minimal 6 karakter" required minlength="6">
          </div>
          <button type="submit" class="btn-submit" id="btn-register">Daftar</button>
        </form>
        <div class="switch-text">
          <p>Sudah punya akun? <button id="btn-show-login">Masuk</button></p>
        </div>
      </div>

      <!-- Error Message -->
      <div id="auth-error" class="error-box" style="display: none;"></div>
    </div>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const loginView = document.getElementById('login-view');
      const registerView = document.getElementById('register-view');
      const errorEl = document.getElementById('auth-error');

      // Cek session sudah ada
      supabaseClient.auth.getSession().then(({ data: { session } }) => {
        if (session) window.location.href = 'index.html';
      });

      // Toggle login/register
      document.getElementById('btn-show-register').addEventListener('click', () => {
        loginView.style.display = 'none';
        registerView.style.display = 'block';
        errorEl.style.display = 'none';
      });

      document.getElementById('btn-show-login').addEventListener('click', () => {
        registerView.style.display = 'none';
        loginView.style.display = 'block';
        errorEl.style.display = 'none';
      });

      function showMessage(msg, isError = true) {
        errorEl.textContent = msg;
        errorEl.style.display = 'block';
        errorEl.className = 'error-box' + (isError ? '' : ' success');
      }

      // Login
      document.getElementById('form-login').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;
        const btn = document.getElementById('btn-login');
        btn.disabled = true;
        btn.textContent = 'Masuk...';
        errorEl.style.display = 'none';

        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) {
          showMessage(error.message);
          btn.disabled = false;
          btn.textContent = 'Masuk';
        } else {
          window.location.href = 'index.html';
        }
      });

      // Register
      document.getElementById('form-register').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('register-name').value;
        const email = document.getElementById('register-email').value;
        const password = document.getElementById('register-password').value;
        const btn = document.getElementById('btn-register');
        btn.disabled = true;
        btn.textContent = 'Mendaftar...';
        errorEl.style.display = 'none';

        // Sign up without trigger - just create auth user
        const { data, error } = await supabaseClient.auth.signUp({
          email,
          password,
          options: { data: { full_name: name } }
        });

        if (error) {
          showMessage(error.message);
          btn.disabled = false;
          btn.textContent = 'Daftar';
          return;
        }

        // Insert profile manually
        if (data.user) {
          await supabaseClient.from('profiles').insert({
            id: data.user.id,
            email: email,
            full_name: name
          });
        }

        showMessage('Akun berhasil dibuat! Silakan masuk.', false);
        registerView.style.display = 'none';
        loginView.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Daftar';
      });
    });
  </script>
</body>
</html>
